# M3.1: first BPE model. TinyStories V2 (GPT-4-only), byte-level BPE 4096.
# Architecture identical to gpt_10m except vocabulary and context:
# 6 layers / 6 heads / 384 wide, context 512 -> 12,417,024 parameters.
# Budget (from the M3 MPS benchmarks): ~0.63 s/step at 16,384 tokens/step,
# 4,800 steps ~ 50 min + 9 full-validation passes (~45 s each) ~ 57 min.
name = "ts_s_bpe4096"
description = "M3.1 TinyStories V2, BPE 4096, 6L/6H/384, ctx 512, ~1 h"

[model]
vocab_size = 4096
context_length = 512
n_layer = 6
n_head = 6
n_embd = 384
dropout = 0.0            # < 1 epoch over ~100M unique tokens: no repetition to regularize
bias = true

[training]
seed = 1337
batch_size = 32          # 32 x 512 = 16,384 tokens per optimizer step (M2 used 16,384 too)
gradient_accumulation_steps = 1
learning_rate = 6e-4     # conservative: below M2's stable 1e-3; GPT-2-small / llama2.c range
min_learning_rate = 6e-5 # 10% of peak
warmup_steps = 200       # ~3.3M tokens
max_steps = 4800         # ~78.6M token presentations
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95             # standard for LM pretraining stability (GPT-3, llama2.c)
grad_clip = 1.0
eval_interval = 600      # every eval runs the FULL official validation set (~5.6M tokens)
eval_steps = 10          # random-batch train/val estimates alongside (cheap)
log_interval = 50
checkpoint_interval = 600
keep_last_checkpoints = 0
save_best = true
exact_val_eval = true    # best.pt selected on the exact full-validation loss
device = "mps"
dtype = "float32"

[data]
dataset = "tinystories_v2"
tokenizer = "bpe"
val_fraction = 0.1       # unused: the official V2 validation file is the held-out set
