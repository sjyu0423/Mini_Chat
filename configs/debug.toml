# Tiny config for smoke tests and debugging. Not meant to learn much.
name = "debug"
description = "Tiny smoke-test model (~0.1M params, estimate)"

[model]
vocab_size = 65          # overwritten from the tokenizer at data-prep time
context_length = 64
n_layer = 2
n_head = 2
n_embd = 64
dropout = 0.0
bias = true

[training]
seed = 1337
batch_size = 8
learning_rate = 1e-3
min_learning_rate = 1e-4
warmup_steps = 10
max_steps = 100
eval_interval = 50
eval_steps = 10
checkpoint_interval = 100
device = "auto"
